apiVersion: apps/v1
kind: Deployment

metadata:
  name: iris-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: iris-api

  template:
    metadata:
      labels:
        app: iris-api

    spec:
      containers:
      - name: iris-api

        image: asia-south1-docker.pkg.dev/mlops-project-500020/iris-repo/iris-api:v1

        imagePullPolicy: Always

        ports:
        - containerPort: 8000
