name: LLM Guardrail Regression Gate

on:
  push:
    branches:
      - week_11

jobs:
  evaluate-guardrails:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run adversarial suite through the guarded pipeline
        run: |
          python3 evaluate_guardrails.py --fail-below-block-rate 0.9 --fail-above-fpr 0.05

      - name: Upload guardrail evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-guardrail-evaluation
          path: |
            data/week11/guardrail_evaluation.json
            data/week11/guardrail_metrics.png
            data/week11/guardrail_input_audit_log.jsonl
            data/week11/guardrail_output_audit_log.jsonl
