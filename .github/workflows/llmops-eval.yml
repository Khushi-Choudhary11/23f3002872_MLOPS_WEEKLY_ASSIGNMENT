name: LLMOps Evaluation Gate

on:
  push:
    branches:
      - week_10

jobs:
  evaluate:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run v1 vs v2 evaluation against both tuned endpoints
        run: |
          python3 evaluate_llm.py --fail-below 0.8

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-evaluation-results
          path: |
            data/week10/evaluation_results.json
            data/week10/llm_comparison.png
