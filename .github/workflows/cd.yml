name: Build and Deploy to GKE

on:
  push:
    branches:
      - week_7

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
  IMAGE: iris-api
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_REGION: ${{ secrets.GKE_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
         credentials_json: ${{ secrets.GCP_SA_KEY }}
         create_credentials_file: true
         export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: |
          gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE:${{ github.sha }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}

      - name: Update Deployment Image
        run: |
          kubectl set image deployment/iris-api iris-api=$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE:${{ github.sha }}

      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/iris-api
      - name: Install wrk
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wrk
      - name: Get External IP
        id: getip
        run: |
          IP=""
          for i in $(seq 1 30); do
            IP=$(kubectl get svc iris-api-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$IP" ]; then break; fi
            echo "Waiting for external IP..."
            sleep 10
          done
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
      - name: Wait for API readiness
        run: |
          IP="${{ steps.getip.outputs.ip }}"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$IP/health || echo "000")
            if [ "$STATUS" == "200" ]; then
              echo "API is healthy"
              break
            fi
            echo "Waiting for API... status=$STATUS"
            sleep 5
          done
      - name: Run Stress Test (wrk)
        run: |
          wrk -t4 -c1000 -d30s -s post.lua http://${{ steps.getip.outputs.ip }}/predict
