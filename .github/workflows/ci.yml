name: IRIS CI Pipeline

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install CML
        run: |
          npm install -g @dvcorg/cml

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Pull DVC Data
        run: |
          dvc pull

      - name: Configure MLflow
        run: |
          echo "MLFLOW_TRACKING_URI=sqlite:///mlflow.db" >> $GITHUB_ENV

      - name: Verify MLflow Model Registry
        run: |
          python - <<EOF
          import mlflow

          mlflow.set_tracking_uri("sqlite:///mlflow.db")

          model = mlflow.pyfunc.load_model(
              "models:/iris_classifier/latest"
          )

          print("Successfully loaded model from MLflow Model Registry")
          EOF

      - name: Run Tests
        run: |
          pytest -v tests | tee report.txt

      - name: Create Report
        run: |
          echo "# CI Test Report" > report.md
          echo "" >> report.md
          cat report.txt >> report.md

      - name: Publish Report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md
